<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0A09" />
    <meta name="description" content="NxStops - Discover what to do right now, wherever you are. Vibe-based travel for modern explorers." />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NxStops" />
    <!-- Open Graph meta tags for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NxStops — Discover Your Next Stop" />
    <meta property="og:description" content="Find what to do right now, wherever you are. Vibe-based travel for modern explorers." />
    <meta property="og:image" content="https://nxstops-new.vercel.app/icon-512.png" />
    <meta property="og:url" content="https://nxstops-new.vercel.app" />
    <meta property="og:site_name" content="NxStops" />
    <!-- Twitter Card meta tags for social sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NxStops — Discover Your Next Stop" />
    <meta name="twitter:description" content="Find what to do right now, wherever you are. Vibe-based travel for modern explorers." />
    <meta name="twitter:image" content="https://nxstops-new.vercel.app/icon-512.png" />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "NxStops",
      "description": "Discover what to do right now, wherever you are. Vibe-based travel for modern explorers.",
      "url": "https://nxstops-new.vercel.app",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>NxStops</title>
    <!-- Google Analytics — TODO: Replace G-XXXXXXXXXX with your GA4 Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    <!-- Theme FOUC prevention — set correct bg before React boots -->
    <script>
      (function() {
        var h = new Date().getHours();
        var dark = h >= 19 || h < 6;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.setProperty('--bg-body', dark ? '#0C0A09' : '#FAFAF9');
        document.documentElement.style.setProperty('--text-primary', dark ? '#FFFBEB' : '#1C1917');
        document.documentElement.style.setProperty('--scrollbar-track', dark ? '#1C1917' : '#F5F5F4');
        document.documentElement.style.setProperty('--scrollbar-thumb', dark ? '#78716C' : '#D6D3D1');
        document.documentElement.style.setProperty('--scrollbar-thumb-hover', '#A8A29E');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
