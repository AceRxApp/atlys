<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0A09"/>
      <stop offset="50%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="amber-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(251,191,36,0)"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.06)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
    <filter id="pin-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#amber)" opacity="0.8"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(251,191,36,0.04)" stroke-width="1" rx="2"/>

  <!-- Pin mark - centered -->
  <g transform="translate(600, 215) scale(0.38)" filter="url(#pin-glow)">
    <path d="M0 352 C-28 279 -112 196 -112 112 C-112 50 -62 0 0 0 C62 0 112 50 112 112 C112 196 28 279 0 352Z"
          fill="url(#amber)"/>
    <circle cx="0" cy="112" r="46" fill="#0C0A09"/>
    <circle cx="0" cy="112" r="46" fill="none" stroke="rgba(251,191,36,0.12)" stroke-width="1"/>
    <circle cx="0" cy="112" r="11" fill="url(#amber)"/>
  </g>

  <!-- Separator line -->
  <rect x="400" y="380" width="400" height="1" fill="url(#amber-line)" opacity="0.3"/>

  <!-- NxStops wordmark -->
  <text x="600" y="355" text-anchor="middle"
        font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#FFFBEB" letter-spacing="3">
    NxStops
  </text>

  <!-- Tagline -->
  <text x="600" y="420" text-anchor="middle"
        font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" fill="#C4A882" letter-spacing="3">
    Discover Your Next Stop
  </text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle"
        font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500" fill="#57534E" letter-spacing="4" text-transform="uppercase">
    nxstops.com
  </text>
</svg>
