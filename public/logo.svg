<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Route line connecting 3 dots — sits above the wordmark -->
  <!-- Curved route path -->
  <path d="M140 160 C180 160 190 200 230 200 C270 200 280 150 320 150 C360 150 370 190 380 190"
        fill="none" stroke="url(#amber)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Stop dots along route -->
  <circle cx="140" cy="160" r="10" fill="#0C0A09" stroke="url(#amber)" stroke-width="2.5"/>
  <circle cx="140" cy="160" r="4" fill="url(#amber)"/>

  <circle cx="230" cy="200" r="10" fill="#0C0A09" stroke="url(#amber)" stroke-width="2.5"/>
  <circle cx="230" cy="200" r="4" fill="url(#amber)"/>

  <circle cx="320" cy="150" r="10" fill="#0C0A09" stroke="url(#amber)" stroke-width="2.5"/>
  <circle cx="320" cy="150" r="4" fill="url(#amber)"/>

  <!-- Destination pin (final stop) -->
  <path d="M380 190 C376 176 366 166 366 156 C366 148 372 142 380 142 C388 142 394 148 394 156 C394 166 384 176 380 190Z"
        fill="url(#amber)"/>
  <circle cx="380" cy="156" r="5" fill="#0C0A09"/>

  <!-- "NxStops" wordmark — one line, large and bold -->
  <text x="256" y="320" text-anchor="middle" font-family="'Outfit','DM Sans',system-ui,sans-serif" font-weight="700" font-size="88" fill="#FAFAF9" letter-spacing="-2">
    <tspan fill="url(#amber)">Nx</tspan><tspan fill="#FAFAF9">Stops</tspan>
  </text>

  <!-- Subtitle -->
  <text x="256" y="370" text-anchor="middle" font-family="'DM Sans',system-ui,sans-serif" font-weight="500" font-size="20" fill="#78716C" letter-spacing="6">YOUR NEXT STOP</text>
</svg>
